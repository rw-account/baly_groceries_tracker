name: baly_groceries_tracker
description: "Baly Groceries Tracker App"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  sqflite: ^2.3.2
  shared_preferences: ^2.2.2
  path: ^1.9.0
  path_provider: ^2.1.6
  flutter_file_dialog: ^3.3.1
  restart_app: ^1.8.3

  flutter_local_notifications: ^22.0.1
  workmanager: ^0.10.9

  uuid: ^4.3.3
  intl: ^0.20.2
  app_settings: ^7.0.0
  go_router: ^17.3.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  share_plus: ^13.2.0
  cupertino_icons: ^1.0.9
  introduction_screen: ^4.0.0
  jiffy: ^6.4.5
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
  
  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: fonts/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: fonts/Tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: fonts/Tajawal/Tajawal-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#01071B"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter_native_splash:
  color: "#01071B"
  image: assets/icons/splash_icon.png

  android: true
  ios: true
  web: false

  android_12:
    image: assets/icons/splash_icon.png
    color: "#01071B"
