name: home_orders_tracker
description: "Home Orders Tracker App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  sqflite: ^2.3.2
  shared_preferences: ^2.2.2
  path: ^1.9.0

  flutter_local_notifications: ^22.0.1
  workmanager: ^0.9.0+3
  timezone: ^0.11.0

  uuid: ^4.3.3
  intl: ^0.20.2
  android_intent_plus: ^6.0.0
  go_router: ^17.3.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
  
# 🌟 تسجيل الخط بكافة أوزانه المتاحة لديك
  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 200 # الوزن الخفيف جداً
        - asset: fonts/Tajawal/Tajawal-Light.ttf
          weight: 300 # الوزن الخفيف
        - asset: fonts/Tajawal/Tajawal-Regular.ttf
          weight: 400 # الوزن العادي (Default)
        - asset: fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500 # الوزن المتوسط
        - asset: fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700 # الوزن العريض (Bold)
        - asset: fonts/Tajawal/Tajawal-ExtraBold.ttf
          weight: 800 # الوزن العريض جداً
        - asset: fonts/Tajawal/Tajawal-Black.ttf
          weight: 900 # الوزن شديد السواد/العرض

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_icon.png

  android: true
  ios: true
  web: false

  android_12:
    image: assets/splash_icon.png
    color: "#FFFFFF"
