name: home_orders_tracker
description: "Home Orders Tracker App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_riverpod: ^2.4.9
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  uuid: ^4.3.3
  intl: ^0.20.2
  workmanager: ^0.9.0+3
  android_intent_plus: ^5.0.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png

  android: true
  ios: true
  web: false

  android_12:
    image: assets/icon.png
    color: "#FFFFFF"
